services:
  vision2cool4u:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision2Cool4u
    restart: unless-stopped
    environment:
      # AIM Configuration
      - AIM_USERNAME=vision2Cool4u
      - AIM_PASSWORD=password
      - AIM_SERVER=aim.visionfun.org
      - AIM_PORT=5190
      
      # Dify API
      - DIFY_API_KEY=app-5kmGGYfP4z0omMEfNYVaLW8B
      - DIFY_API_URL=http://52.89.105.190/v1
      # API_MODE: "blocking" for standard bots, "streaming" for agent bots
      - API_MODE=blocking
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/vision2Cool4u.log
      - CONVERSATION_LOG_DIR=/app/logs/conversations/vision2Cool4u
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/logs
      
